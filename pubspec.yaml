name: newsly
description: AI-powered News app in Flutter with NewsAPI and OpenAI summaries.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  flutter_tts: ^3.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - .env